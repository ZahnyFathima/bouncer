<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Bouncer</title>
<link rel="stylesheet" href="../utils/theme.css" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    width: calc(100% - 40px);
    margin: 20px;
    padding: 24px;
    text-align: center;
    background: var(--surface);
    border: var(--border-w) solid #000;
    box-shadow: 8px 8px 0 #000;
  }
  .remark {
    font-size: 19px;
    font-weight: 900;
    text-transform: uppercase;
    color: #000;
    margin: 0 0 10px;
    line-height: 1.3;
    padding-bottom: 14px;
    border-bottom: 2px solid #000;
  }
  .closed-title {
    font-size: 11px;
    color: var(--ink-soft);
    margin: 0 0 20px;
    word-break: break-word;
    font-weight: 600;
  }
  #ackBtn {
    padding: 10px 28px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
  <div class="card">
    <p class="remark" id="remark"></p>
    <p class="closed-title" id="closedTitle"></p>
    <button class="btn btn-primary" id="ackBtn"></button>
  </div>
  <script src="alert.js"></script>
</body>
</html>
